<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Learning Time Analysis Calculator</title>
<meta name="description" content="Estimate total student learning time across course modules. Based on the credit-hour standard of 45 hrs per credit." />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f3f4f6;
    color: #111827;
    min-height: 100vh;
  }
  button { font-family: inherit; }
  input, select { font-family: inherit; }
  @media print {
    .no-print { display: none !important; }
    body { background: white !important; }
    .panel { border: none !important; box-shadow: none !important; }
  }
</style>
</head>
<body>
<div id="root"><div class="ltc-loading" style="padding:40px;font-family:system-ui;color:#6b7280;font-size:15px">Loading the calculator…</div></div>

<script>
  // Turn a blank page into a readable message so problems can be diagnosed remotely.
  window.addEventListener('error', function (e) {
    var root = document.getElementById('root');
    if (!root) return;
    var msg = (e && (e.message || (e.error && e.error.message))) || 'Unknown error';
    var src = e && e.filename ? ('\n\nSource: ' + e.filename + (e.lineno ? ':' + e.lineno : '')) : '';
    root.innerHTML =
      '<div style="padding:24px;margin:20px;font-family:system-ui;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;white-space:pre-wrap">'
      + '<strong>The calculator hit an error while loading.</strong>\n\n' + msg + src + '</div>';
  }, true);
  // If nothing has mounted after 8s, the likely cause is a blocked/slow CDN script.
  window.addEventListener('load', function () {
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.querySelector('.ltc-loading')) {
        root.innerHTML =
          '<div style="padding:24px;margin:20px;font-family:system-ui;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px">'
          + 'Still loading after several seconds. This usually means a CDN script (React, Babel, or Chart.js) was blocked or failed to load. '
          + 'Open the browser Console (F12) to see which request failed, then try a hard refresh (Cmd/Ctrl+Shift+R).</div>';
      }
    }, 8000);
  });
</script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

// ============================================================
// BRAND COLORS (University of Pittsburgh palette)
// ============================================================
const PITT_BLUE = '#003594';   // Pitt Royal
const PITT_GOLD = '#FFB81C';   // Pitt Gold
const PITT_ACCENT = '#0067A0'; // supporting blue

// ============================================================
// LOOKUP TABLES (sourced directly from the Excel workbook)
// ============================================================

const ILO_COMPLEXITY = {
  'Low': 1,
  'Medium': 3,
  'High': 7,
};

const READING_TYPES = {
  'Textbook (standard)': 400,
  'Textbook (technical)': 500,
  'Article/Handout': 250,
};

const READING_PURPOSES = {
  'Comprehension': 300,
  'Application': 200,
  'Analysis': 200,
  'Memorization': 138,
  'Deep Engagement': 100,
  'Skimming': 525,
  'Average': 243.8333,
};

const WRITING_HOURS_PER_PAGE = {
  'Reflection/Narrative|No Drafting': 0.75,
  'Reflection/Narrative|Minimal Drafting': 1,
  'Reflection/Narrative|Extensive Drafting': 1.25,
  'Argument|No Drafting': 1.5,
  'Argument|Minimal Drafting': 2,
  'Argument|Extensive Drafting': 2.5,
  'Research|No Drafting': 3,
  'Research|Minimal Drafting': 4,
  'Research|Extensive Drafting': 5,
};

const ASSIGNMENT_HOURS = {
  'Blog Entry (public)': 0.5,
  'Journal Entry (private)': 0.5,
  'Case Study': 1,
  'Problem Solving': 1,
};

const PROJECT_HOURS = {
  'Group Project Deliverable': 1,
  'Media Project: Podcast': 1,
  'Media Project: Video': 1,
  'Written Project': 1,
  'Presentation': 1,
};

const WRITING_TYPES = ['Reflection/Narrative', 'Argument', 'Research'];
const DRAFTING_LEVELS = ['No Drafting', 'Minimal Drafting', 'Extensive Drafting'];

// Term-length options (weeks). See beta-review note re: verifying the full set.
const TERM_OPTIONS = [4, 6, 7, 8, 12, 15];

const HOURS_PER_CREDIT = 45;
const MAX_WEEKS = 15; // largest supported term

// ============================================================
// EMPTY MODULE FACTORY
// ============================================================

const makeEmptyModule = () => ({
  liveMeeting: 0,
  reading1Type: 'Textbook (standard)',
  reading1Purpose: 'Comprehension',
  reading1Pages: 0,
  reading2Type: 'Article/Handout',
  reading2Purpose: 'Analysis',
  reading2Pages: 0,
  lectureVideoMin: 0,
  lectureSlides: 0,
  iloType: 'Interactive Video',
  iloComplexity: 'Medium',
  iloUnits: 0,
  audiovisualMin: 0,
  discussionInitial: 0,
  discussionReply: 0,
  assignment1Type: 'Journal Entry (private)',
  assignment1Count: 0,
  assignment2Type: 'Blog Entry (public)',
  assignment2Count: 0,
  quizQuestions: 0,
  examQuestions: 0,
  writingType: 'Argument',
  writingDrafting: 'Extensive Drafting',
  writingPages: 0,
  projectType: 'Written Project',
  projectCount: 0,
  projectHoursEach: 1,
  studyTime: 0,
  adjustments: 0,
  adjustmentsNote: '',
});

// ============================================================
// CALCULATION LOGIC
// ============================================================

const calcReadingHours = (type, purpose, pages) => {
  const wpp = READING_TYPES[type] || 0;
  const wpm = READING_PURPOSES[purpose] || 0;
  if (!wpp || !wpm || !pages) return 0;
  return (pages * wpp) / wpm / 60;
};

const calcModule = (m) => {
  const reviewExpectations = 0.5;
  const reading1 = calcReadingHours(m.reading1Type, m.reading1Purpose, +m.reading1Pages);
  const reading2 = calcReadingHours(m.reading2Type, m.reading2Purpose, +m.reading2Pages);
  const lectureVideo = (+m.lectureVideoMin * 2) / 60;
  const lectureSlides = (+m.lectureSlides * 1.5) / 60;
  const ilo = ((+m.iloUnits) * (ILO_COMPLEXITY[m.iloComplexity] || 0)) / 60;
  const audiovisual = (+m.audiovisualMin * 2) / 60;

  const learningContent =
    reviewExpectations + reading1 + reading2 + lectureVideo + lectureSlides + ilo + audiovisual;

  const discussionInitial = (+m.discussionInitial * 60) / 60;
  const discussionReply = (+m.discussionReply * 15) / 60;
  const assignment1 = (+m.assignment1Count) * (ASSIGNMENT_HOURS[m.assignment1Type] || 0);
  const assignment2 = (+m.assignment2Count) * (ASSIGNMENT_HOURS[m.assignment2Type] || 0);
  const quiz = (+m.quizQuestions * 1.5) / 60;
  const exam = (+m.examQuestions * 1.5) / 60;
  const writingKey = `${m.writingType}|${m.writingDrafting}`;
  const writing = (+m.writingPages) * (WRITING_HOURS_PER_PAGE[writingKey] || 0);
  const project = (+m.projectCount) * (PROJECT_HOURS[m.projectType] || 0) * (+m.projectHoursEach);
  const studyTime = (+m.studyTime * 75) / 60;
  const adjustments = +m.adjustments;

  const assignments =
    discussionInitial + discussionReply + assignment1 + assignment2 +
    quiz + exam + writing + project + studyTime + adjustments;

  const liveMeeting = +m.liveMeeting;
  const moduleTotal = liveMeeting + learningContent + assignments;

  return { liveMeeting, learningContent, assignments, moduleTotal };
};

// ============================================================
// UI HELPERS  (all defined at module scope so inputs never remount)
// ============================================================

const fmt = (n) => (Math.round(n * 100) / 100).toFixed(2);

const moduleLabel = (i) => (i === 0 ? 'Orientation (Module 0)' : `Module ${i}`);
const moduleTab = (i) => (i === 0 ? 'Orient.' : `Mod ${i}`);

const FieldRow = ({ label, hint, children }) => (
  <div style={{ display: 'grid', gridTemplateColumns: '180px 1fr', gap: '8px', alignItems: 'center', marginBottom: '6px' }}>
    <label title={hint || undefined} style={{ fontSize: '13px', color: '#374151', cursor: hint ? 'help' : 'default' }}>
      {label}
      {hint && <span style={{ marginLeft: '4px', color: '#9ca3af', fontSize: '11px' }} title={hint}>&#9432;</span>}
    </label>
    <div>{children}</div>
  </div>
);

const NumInput = ({ value, onChange, step = 1, min = 0 }) => (
  <input
    type="number"
    value={value}
    onChange={(e) => onChange(e.target.value)}
    step={step}
    min={min}
    style={{ width: '100%', padding: '4px 8px', border: '1px solid #d1d5db', borderRadius: '4px', fontSize: '13px' }}
  />
);

const TextInput = ({ value, onChange, placeholder }) => (
  <input
    type="text"
    value={value}
    onChange={(e) => onChange(e.target.value)}
    placeholder={placeholder}
    style={{ width: '100%', padding: '4px 8px', border: '1px solid #d1d5db', borderRadius: '4px', fontSize: '13px' }}
  />
);

const Select = ({ value, onChange, options }) => (
  <select
    value={value}
    onChange={(e) => onChange(e.target.value)}
    style={{ width: '100%', padding: '4px 8px', border: '1px solid #d1d5db', borderRadius: '4px', fontSize: '13px', background: 'white' }}
  >
    {options.map(o => <option key={o} value={o}>{o}</option>)}
  </select>
);

const Section = ({ title, children }) => (
  <div style={{ marginBottom: '16px' }}>
    <div style={{ fontSize: '12px', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.05em', color: '#6b7280', marginBottom: '8px', borderBottom: '1px solid #e5e7eb', paddingBottom: '4px' }}>
      {title}
    </div>
    {children}
  </div>
);

// ============================================================
// CHART COMPONENT (Chart.js wrapper)
// ============================================================

const ChartCanvas = ({ type, data, options }) => {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) {
      chartRef.current.destroy();
    }
    chartRef.current = new Chart(canvasRef.current, { type, data, options });
    return () => {
      if (chartRef.current) chartRef.current.destroy();
    };
  }, [type, JSON.stringify(data), JSON.stringify(options)]);

  return <canvas ref={canvasRef} />;
};

// ============================================================
// MODULE EDITOR
// ============================================================

const ModuleEditor = ({ module, onChange, moduleIndex, results }) => {
  const upd = (key) => (val) => onChange({ ...module, [key]: val });

  return (
    <div className="panel" style={{ background: 'white', border: '1px solid #e5e7eb', borderRadius: '8px', padding: '16px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '16px' }}>
        <h3 style={{ margin: 0, fontSize: '18px', color: '#111827' }}>{moduleLabel(moduleIndex)}</h3>
        <div style={{ fontSize: '13px', color: '#6b7280' }}>
          Total: <span style={{ fontWeight: 600, color: '#111827' }}>{fmt(results.moduleTotal)} hrs</span>
        </div>
      </div>

      <Section title="Live Meeting">
        <FieldRow label="Live meeting (hrs)" hint="Synchronous contact time: lecture, clinical, or lab hours.">
          <NumInput value={module.liveMeeting} onChange={upd('liveMeeting')} step={0.25} />
        </FieldRow>
      </Section>

      <Section title="Instructional Materials">
        <FieldRow label="Reading #1 type" hint="Textbook (standard/technical) or article/handout — sets words per page.">
          <Select value={module.reading1Type} onChange={upd('reading1Type')} options={Object.keys(READING_TYPES)} />
        </FieldRow>
        <FieldRow label="Reading #1 purpose" hint="Reading goal sets the reading speed (words per minute).">
          <Select value={module.reading1Purpose} onChange={upd('reading1Purpose')} options={Object.keys(READING_PURPOSES)} />
        </FieldRow>
        <FieldRow label="Reading #1 pages" hint="Enter the number of pages assigned.">
          <NumInput value={module.reading1Pages} onChange={upd('reading1Pages')} />
        </FieldRow>

        <FieldRow label="Reading #2 type" hint="A second reading of a different type, if applicable.">
          <Select value={module.reading2Type} onChange={upd('reading2Type')} options={Object.keys(READING_TYPES)} />
        </FieldRow>
        <FieldRow label="Reading #2 purpose" hint="Reading goal sets the reading speed (words per minute).">
          <Select value={module.reading2Purpose} onChange={upd('reading2Purpose')} options={Object.keys(READING_PURPOSES)} />
        </FieldRow>
        <FieldRow label="Reading #2 pages" hint="Enter the number of pages assigned.">
          <NumInput value={module.reading2Pages} onChange={upd('reading2Pages')} />
        </FieldRow>

        <FieldRow label="Lecture video (min)" hint="Runtime in minutes. Student time is estimated at 2x runtime.">
          <NumInput value={module.lectureVideoMin} onChange={upd('lectureVideoMin')} step={0.25} />
        </FieldRow>
        <FieldRow label="Lecture PPT (slides)" hint="Number of slides. Estimated at 1.5 min per slide.">
          <NumInput value={module.lectureSlides} onChange={upd('lectureSlides')} />
        </FieldRow>

        <FieldRow label="ILO complexity" hint="Interactive Learning Object. Low = 1 min, Medium = 3 min, High = 7 min per unit.">
          <Select value={module.iloComplexity} onChange={upd('iloComplexity')} options={Object.keys(ILO_COMPLEXITY)} />
        </FieldRow>
        <FieldRow label="ILO units" hint="Number of interactive objects (e.g., H5P activities, simulations).">
          <NumInput value={module.iloUnits} onChange={upd('iloUnits')} />
        </FieldRow>

        <FieldRow label="Audiovisual (min)" hint="Podcasts, external video, etc. Estimated at 2x runtime.">
          <NumInput value={module.audiovisualMin} onChange={upd('audiovisualMin')} step={0.25} />
        </FieldRow>
      </Section>

      <Section title="Assignments">
        <FieldRow label="Discussion initial posts" hint="Count of original posts. 1 hr each.">
          <NumInput value={module.discussionInitial} onChange={upd('discussionInitial')} />
        </FieldRow>
        <FieldRow label="Discussion replies" hint="Count of reply posts. 15 min each.">
          <NumInput value={module.discussionReply} onChange={upd('discussionReply')} />
        </FieldRow>

        <FieldRow label="Assignment #1 type" hint="Blog/journal = 0.5 hr; case study/problem solving = 1 hr each.">
          <Select value={module.assignment1Type} onChange={upd('assignment1Type')} options={Object.keys(ASSIGNMENT_HOURS)} />
        </FieldRow>
        <FieldRow label="Assignment #1 count" hint="Number of items of this type.">
          <NumInput value={module.assignment1Count} onChange={upd('assignment1Count')} />
        </FieldRow>

        <FieldRow label="Assignment #2 type" hint="A second assignment type, if applicable.">
          <Select value={module.assignment2Type} onChange={upd('assignment2Type')} options={Object.keys(ASSIGNMENT_HOURS)} />
        </FieldRow>
        <FieldRow label="Assignment #2 count" hint="Number of items of this type.">
          <NumInput value={module.assignment2Count} onChange={upd('assignment2Count')} />
        </FieldRow>

        <FieldRow label="Quiz questions" hint="Total quiz questions. 1.5 min each.">
          <NumInput value={module.quizQuestions} onChange={upd('quizQuestions')} />
        </FieldRow>
        <FieldRow label="Exam questions" hint="Total exam questions. 1.5 min each.">
          <NumInput value={module.examQuestions} onChange={upd('examQuestions')} />
        </FieldRow>

        <FieldRow label="Writing type" hint="Reflection/Narrative, Argument, or Research — sets hours per page.">
          <Select value={module.writingType} onChange={upd('writingType')} options={WRITING_TYPES} />
        </FieldRow>
        <FieldRow label="Drafting level" hint="More drafting = more hours per page.">
          <Select value={module.writingDrafting} onChange={upd('writingDrafting')} options={DRAFTING_LEVELS} />
        </FieldRow>
        <FieldRow label="Writing pages" hint="Target page count for the written work.">
          <NumInput value={module.writingPages} onChange={upd('writingPages')} />
        </FieldRow>

        <FieldRow label="Project type" hint="Group, media, written, or presentation project.">
          <Select value={module.projectType} onChange={upd('projectType')} options={Object.keys(PROJECT_HOURS)} />
        </FieldRow>
        <FieldRow label="Project count" hint="Number of projects of this type.">
          <NumInput value={module.projectCount} onChange={upd('projectCount')} />
        </FieldRow>
        <FieldRow label="Hours per project" hint="Estimated student hours for each project.">
          <NumInput value={module.projectHoursEach} onChange={upd('projectHoursEach')} step={0.5} />
        </FieldRow>

        <FieldRow label="Student study time (hrs)" hint="Independent study/review. Weighted at 1.25x entered hours.">
          <NumInput value={module.studyTime} onChange={upd('studyTime')} step={0.25} />
        </FieldRow>
        <FieldRow label="Adjustments (hrs)" hint="Use this to add time for any activity type not listed above.">
          <NumInput value={module.adjustments} onChange={upd('adjustments')} step={0.25} />
        </FieldRow>
        <FieldRow label="Adjustment notes" hint="Optional: describe what the adjustment hours account for.">
          <TextInput value={module.adjustmentsNote} onChange={upd('adjustmentsNote')} placeholder="e.g., field observation, guest speaker prep" />
        </FieldRow>
        <div style={{ fontSize: '11px', color: '#6b7280', fontStyle: 'italic', marginTop: '2px', marginBottom: '8px' }}>
          If your course includes an activity type not listed here, use the Adjustments row to account for that time and add a note.
        </div>
      </Section>

      <div style={{ background: '#f9fafb', borderRadius: '6px', padding: '10px', fontSize: '12px', color: '#374151' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
          <span>Live meeting:</span><span>{fmt(results.liveMeeting)} hrs</span>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
          <span>Instructional materials:</span><span>{fmt(results.learningContent)} hrs</span>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
          <span>Assignments:</span><span>{fmt(results.assignments)} hrs</span>
        </div>
      </div>
    </div>
  );
};

// ============================================================
// MAIN APP
// ============================================================

function LearningTimeCalculator() {
  const [courseName, setCourseName] = useState('');
  const [credits, setCredits] = useState(3);
  const [modality, setModality] = useState('Asynchronous');
  const [termLength, setTermLength] = useState(15);
  const [includeOrientation, setIncludeOrientation] = useState(true);
  const [view, setView] = useState('semester');
  const [activeModule, setActiveModule] = useState(0);

  // Fixed store: index i === "Module i" (0 = orientation, 1..15 = teaching weeks)
  const [modules, setModules] = useState(() =>
    Array.from({ length: MAX_WEEKS + 1 }, () => makeEmptyModule())
  );

  const targetHours = credits * HOURS_PER_CREDIT;

  // Which module indices are currently visible
  const visibleIndices = useMemo(() => {
    const first = includeOrientation ? 0 : 1;
    const arr = [];
    for (let i = first; i <= termLength; i++) arr.push(i);
    return arr;
  }, [includeOrientation, termLength]);

  const visible = useMemo(
    () => visibleIndices.map(i => ({ index: i, result: calcModule(modules[i]) })),
    [visibleIndices, modules]
  );

  const totals = useMemo(() => {
    const live = visible.reduce((s, v) => s + v.result.liveMeeting, 0);
    const learn = visible.reduce((s, v) => s + v.result.learningContent, 0);
    const assign = visible.reduce((s, v) => s + v.result.assignments, 0);
    return { live, learn, assign, grand: live + learn + assign };
  }, [visible]);

  const editorResult = calcModule(modules[activeModule]);

  const updateModule = (idx, m) => {
    const next = [...modules];
    next[idx] = m;
    setModules(next);
  };

  const handleTermChange = (val) => {
    const t = +val;
    setTermLength(t);
    if (activeModule > t) setActiveModule(includeOrientation ? 0 : 1);
  };

  const handleOrientationToggle = (checked) => {
    setIncludeOrientation(checked);
    if (!checked && activeModule === 0) setActiveModule(1);
  };

  // ---- Chart data ----
  const weekChartData = useMemo(() => ({
    labels: visible.map(v => (v.index === 0 ? 'Orient.' : `Mod ${v.index}`)),
    datasets: [
      { label: 'Live Meeting', data: visible.map(v => +v.result.liveMeeting.toFixed(2)), backgroundColor: PITT_BLUE },
      { label: 'Instructional Materials', data: visible.map(v => +v.result.learningContent.toFixed(2)), backgroundColor: PITT_GOLD },
      { label: 'Assignments', data: visible.map(v => +v.result.assignments.toFixed(2)), backgroundColor: PITT_ACCENT },
    ]
  }), [visible]);

  const weekChartOptions = {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      x: { stacked: true, ticks: { font: { size: 11 } } },
      y: { stacked: true, ticks: { font: { size: 11 } }, title: { display: true, text: 'Hours', font: { size: 12 } } }
    },
    plugins: {
      legend: { position: 'bottom', labels: { font: { size: 12 } } },
      tooltip: { mode: 'index', intersect: false }
    }
  };

  const semesterChartData = useMemo(() => ({
    labels: ['Live Meeting', 'Instructional Materials', 'Assignments'],
    datasets: [{
      data: [+totals.live.toFixed(2), +totals.learn.toFixed(2), +totals.assign.toFixed(2)],
      backgroundColor: [PITT_BLUE, PITT_GOLD, PITT_ACCENT],
    }]
  }), [totals]);

  const semesterChartOptions = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'right', labels: { font: { size: 12 } } },
      tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${ctx.raw} hrs` } }
    }
  };

  // ---- PDF export: set a sensible default filename via document.title ----
  const handleExport = () => {
    const prev = document.title;
    document.title = courseName
      ? `Learning Time Analysis - ${courseName}`
      : 'Learning Time Analysis';
    window.print();
    setTimeout(() => { document.title = prev; }, 800);
  };

  const variance = totals.grand - targetHours;
  const variancePct = targetHours ? (variance / targetHours) * 100 : 0;
  const varianceColor = Math.abs(variancePct) <= 10 ? '#10b981' : Math.abs(variancePct) <= 20 ? '#f59e0b' : '#ef4444';

  const swatch = (color) => ({ display: 'inline-block', width: 10, height: 10, background: color, borderRadius: 2, marginRight: 8 });

  return (
    <div style={{ padding: '20px' }}>
      <div style={{ maxWidth: '1400px', margin: '0 auto' }}>
        {/* HEADER */}
        <div className="panel" style={{ background: 'white', border: '1px solid #e5e7eb', borderRadius: '8px', padding: '20px', marginBottom: '16px', borderTop: `4px solid ${PITT_BLUE}` }}>
          <h1 style={{ margin: '0 0 4px 0', fontSize: '22px' }}>Learning Time Analysis</h1>
          <p style={{ margin: '0 0 16px 0', fontSize: '13px', color: '#6b7280' }}>
            Estimate total student learning time across course modules. Based on the credit-hour standard ({HOURS_PER_CREDIT} hrs / credit).
          </p>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '12px' }}>
            <div>
              <label style={{ display: 'block', fontSize: '12px', color: '#6b7280', marginBottom: '4px' }}>Course name</label>
              <input
                type="text"
                value={courseName}
                onChange={(e) => setCourseName(e.target.value)}
                placeholder="e.g., HHD 2007"
                style={{ width: '100%', padding: '6px 10px', border: '1px solid #d1d5db', borderRadius: '4px', fontSize: '14px' }}
              />
            </div>
            <div>
              <label style={{ display: 'block', fontSize: '12px', color: '#6b7280', marginBottom: '4px' }}>Credits</label>
              <input
                type="number"
                value={credits}
                onChange={(e) => setCredits(+e.target.value || 0)}
                min={0}
                step={1}
                style={{ width: '100%', padding: '6px 10px', border: '1px solid #d1d5db', borderRadius: '4px', fontSize: '14px' }}
              />
            </div>
            <div>
              <label style={{ display: 'block', fontSize: '12px', color: '#6b7280', marginBottom: '4px' }}>Modality</label>
              <select
                value={modality}
                onChange={(e) => setModality(e.target.value)}
                style={{ width: '100%', padding: '6px 10px', border: '1px solid #d1d5db', borderRadius: '4px', fontSize: '14px', background: 'white' }}
              >
                <option>Asynchronous</option>
                <option>Synchronous</option>
                <option>Hybrid</option>
                <option>In-person</option>
              </select>
            </div>
            <div>
              <label style={{ display: 'block', fontSize: '12px', color: '#6b7280', marginBottom: '4px' }}>Term length (weeks)</label>
              <select
                value={termLength}
                onChange={(e) => handleTermChange(e.target.value)}
                style={{ width: '100%', padding: '6px 10px', border: '1px solid #d1d5db', borderRadius: '4px', fontSize: '14px', background: 'white' }}
              >
                {TERM_OPTIONS.map(w => <option key={w} value={w}>{w} weeks</option>)}
              </select>
            </div>
            <div style={{ display: 'flex', alignItems: 'flex-end' }}>
              <label style={{ display: 'flex', alignItems: 'center', gap: '6px', fontSize: '13px', color: '#374151', cursor: 'pointer' }}>
                <input
                  type="checkbox"
                  checked={includeOrientation}
                  onChange={(e) => handleOrientationToggle(e.target.checked)}
                />
                Include orientation (Module 0)
              </label>
            </div>
          </div>
        </div>

        {/* SUMMARY + CHART */}
        <div className="panel" style={{ background: 'white', border: '1px solid #e5e7eb', borderRadius: '8px', padding: '20px', marginBottom: '16px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: '16px', marginBottom: '16px' }}>
            <div style={{ display: 'flex', gap: '24px', flexWrap: 'wrap' }}>
              <div>
                <div style={{ fontSize: '12px', color: '#6b7280' }}>Target</div>
                <div style={{ fontSize: '24px', fontWeight: 600 }}>{targetHours} <span style={{ fontSize: '14px', fontWeight: 400, color: '#6b7280' }}>hrs</span></div>
              </div>
              <div>
                <div style={{ fontSize: '12px', color: '#6b7280' }}>Calculated</div>
                <div style={{ fontSize: '24px', fontWeight: 600 }}>{fmt(totals.grand)} <span style={{ fontSize: '14px', fontWeight: 400, color: '#6b7280' }}>hrs</span></div>
              </div>
              <div>
                <div style={{ fontSize: '12px', color: '#6b7280' }}>Variance</div>
                <div style={{ fontSize: '24px', fontWeight: 600, color: varianceColor }}>
                  {variance >= 0 ? '+' : ''}{fmt(variance)} <span style={{ fontSize: '14px', fontWeight: 400 }}>({variancePct >= 0 ? '+' : ''}{fmt(variancePct)}%)</span>
                </div>
              </div>
            </div>

            <div className="no-print" style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
              <div style={{ display: 'flex', border: '1px solid #d1d5db', borderRadius: '6px', overflow: 'hidden' }}>
                <button
                  onClick={() => setView('week')}
                  style={{ padding: '8px 16px', border: 'none', background: view === 'week' ? PITT_BLUE : 'white', color: view === 'week' ? 'white' : '#111827', cursor: 'pointer', fontSize: '13px' }}
                >Week view</button>
                <button
                  onClick={() => setView('semester')}
                  style={{ padding: '8px 16px', border: 'none', background: view === 'semester' ? PITT_BLUE : 'white', color: view === 'semester' ? 'white' : '#111827', cursor: 'pointer', fontSize: '13px' }}
                >Semester view</button>
              </div>
              <button
                onClick={handleExport}
                style={{ padding: '8px 16px', border: `1px solid ${PITT_BLUE}`, borderRadius: '6px', background: PITT_BLUE, color: 'white', cursor: 'pointer', fontSize: '13px' }}
              >Export PDF</button>
            </div>
          </div>

          {view === 'week' ? (
            <div style={{ width: '100%', height: 320 }}>
              <ChartCanvas type="bar" data={weekChartData} options={weekChartOptions} />
            </div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px' }}>
              <div style={{ height: 280 }}>
                <ChartCanvas type="doughnut" data={semesterChartData} options={semesterChartOptions} />
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '14px' }}>
                  <thead>
                    <tr style={{ borderBottom: '2px solid #e5e7eb' }}>
                      <th style={{ textAlign: 'left', padding: '8px', color: '#6b7280', fontWeight: 600 }}>Category</th>
                      <th style={{ textAlign: 'right', padding: '8px', color: '#6b7280', fontWeight: 600 }}>Hours</th>
                      <th style={{ textAlign: 'right', padding: '8px', color: '#6b7280', fontWeight: 600 }}>% of total</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style={{ borderBottom: '1px solid #f3f4f6' }}>
                      <td style={{ padding: '8px' }}><span style={swatch(PITT_BLUE)}/>Live Meeting</td>
                      <td style={{ textAlign: 'right', padding: '8px' }}>{fmt(totals.live)}</td>
                      <td style={{ textAlign: 'right', padding: '8px' }}>{totals.grand ? fmt(totals.live / totals.grand * 100) : '0.00'}%</td>
                    </tr>
                    <tr style={{ borderBottom: '1px solid #f3f4f6' }}>
                      <td style={{ padding: '8px' }}><span style={swatch(PITT_GOLD)}/>Instructional Materials</td>
                      <td style={{ textAlign: 'right', padding: '8px' }}>{fmt(totals.learn)}</td>
                      <td style={{ textAlign: 'right', padding: '8px' }}>{totals.grand ? fmt(totals.learn / totals.grand * 100) : '0.00'}%</td>
                    </tr>
                    <tr style={{ borderBottom: '1px solid #f3f4f6' }}>
                      <td style={{ padding: '8px' }}><span style={swatch(PITT_ACCENT)}/>Assignments</td>
                      <td style={{ textAlign: 'right', padding: '8px' }}>{fmt(totals.assign)}</td>
                      <td style={{ textAlign: 'right', padding: '8px' }}>{totals.grand ? fmt(totals.assign / totals.grand * 100) : '0.00'}%</td>
                    </tr>
                    <tr style={{ fontWeight: 600 }}>
                      <td style={{ padding: '8px' }}>Total</td>
                      <td style={{ textAlign: 'right', padding: '8px' }}>{fmt(totals.grand)}</td>
                      <td style={{ textAlign: 'right', padding: '8px' }}>100.00%</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>

        {/* MODULE TABS */}
        <div className="no-print" style={{ display: 'flex', gap: '4px', flexWrap: 'wrap', marginBottom: '12px' }}>
          {visible.map(v => (
            <button
              key={v.index}
              onClick={() => setActiveModule(v.index)}
              style={{
                padding: '6px 12px',
                border: '1px solid #d1d5db',
                borderRadius: '4px',
                background: activeModule === v.index ? '#111827' : 'white',
                color: activeModule === v.index ? 'white' : '#111827',
                cursor: 'pointer',
                fontSize: '12px',
                fontWeight: activeModule === v.index ? 600 : 400,
              }}
            >
              {moduleTab(v.index)}
              {v.result.moduleTotal > 0.5 && (
                <span style={{ marginLeft: '6px', fontSize: '10px', opacity: 0.7 }}>
                  {fmt(v.result.moduleTotal)}h
                </span>
              )}
            </button>
          ))}
        </div>

        <div className="no-print">
          <ModuleEditor
            module={modules[activeModule]}
            onChange={(m) => updateModule(activeModule, m)}
            moduleIndex={activeModule}
            results={editorResult}
          />
        </div>

        {/* DETAILED TABLE */}
        <div className="panel" style={{ background: 'white', border: '1px solid #e5e7eb', borderRadius: '8px', padding: '20px', marginTop: '16px' }}>
          <h2 style={{ margin: '0 0 12px 0', fontSize: '18px' }}>Per-module breakdown</h2>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
              <thead>
                <tr style={{ borderBottom: '2px solid #e5e7eb', background: '#f9fafb' }}>
                  <th style={{ textAlign: 'left', padding: '8px' }}>Module</th>
                  <th style={{ textAlign: 'right', padding: '8px' }}>Live Meeting</th>
                  <th style={{ textAlign: 'right', padding: '8px' }}>Instructional Materials</th>
                  <th style={{ textAlign: 'right', padding: '8px' }}>Assignments</th>
                  <th style={{ textAlign: 'right', padding: '8px' }}>Total</th>
                </tr>
              </thead>
              <tbody>
                {visible.map(v => (
                  <tr key={v.index} style={{ borderBottom: '1px solid #f3f4f6' }}>
                    <td style={{ padding: '8px' }}>{moduleLabel(v.index)}</td>
                    <td style={{ textAlign: 'right', padding: '8px' }}>{fmt(v.result.liveMeeting)}</td>
                    <td style={{ textAlign: 'right', padding: '8px' }}>{fmt(v.result.learningContent)}</td>
                    <td style={{ textAlign: 'right', padding: '8px' }}>{fmt(v.result.assignments)}</td>
                    <td style={{ textAlign: 'right', padding: '8px', fontWeight: 600 }}>{fmt(v.result.moduleTotal)}</td>
                  </tr>
                ))}
                <tr style={{ borderTop: '2px solid #111827', fontWeight: 600, background: '#f9fafb' }}>
                  <td style={{ padding: '8px' }}>Semester Total</td>
                  <td style={{ textAlign: 'right', padding: '8px' }}>{fmt(totals.live)}</td>
                  <td style={{ textAlign: 'right', padding: '8px' }}>{fmt(totals.learn)}</td>
                  <td style={{ textAlign: 'right', padding: '8px' }}>{fmt(totals.assign)}</td>
                  <td style={{ textAlign: 'right', padding: '8px' }}>{fmt(totals.grand)}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div style={{ marginTop: '12px', fontSize: '12px', color: '#6b7280' }}>
            {courseName && <span><strong>{courseName}</strong> &middot; </span>}
            {credits} credit{credits !== 1 ? 's' : ''} &middot; {modality} &middot; {termLength}-week term
            {includeOrientation ? ' + orientation' : ''} &middot; Target {targetHours} hrs
          </div>
        </div>

        <div className="no-print" style={{ marginTop: '24px', textAlign: 'center', fontSize: '12px', color: '#9ca3af' }}>
          Learning Time Analysis Calculator &middot; Open source
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LearningTimeCalculator />);
</script>
</body>
</html>
